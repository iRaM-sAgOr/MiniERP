services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: minierp-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PORT: 8080
      NODE_ENV: production
      VITE_MIDDLEWARE: "false"
    ports:
      - "8080:8080"
