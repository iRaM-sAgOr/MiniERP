services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: minierp-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to your cloud postgres URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 8080
      NODE_ENV: production
      VITE_MIDDLEWARE: "false"
    ports:
      - "8080:8080"
