services:
  postgres:
    image: postgres:16-alpine
    container_name: minierp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minierp
      POSTGRES_PASSWORD: minierp_password_2025_ai_solution_usa
      POSTGRES_DB: minierp
    # Do not publish DB port on VM/public hosts.
    # Access from SSH session using:
    # docker compose -f docker-compose.local.yml exec postgres psql -U minierp -d minierp
    volumes:
      - minierp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minierp -d minierp"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: minierp-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://minierp:minierp_password_2025_ai_solution_usa@postgres:5432/minierp?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 8080
      NODE_ENV: production
      VITE_MIDDLEWARE: "false"
    ports:
      - "8080:8080"

volumes:
  minierp_pg_data:
